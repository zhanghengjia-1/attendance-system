<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备工作台 - SYRC</title>
<style>
  :root {
    --bg0: #07111f;
    --bg1: #0c1a2e;
    --panel: rgba(16, 32, 56, 0.78);
    --line: rgba(120, 180, 255, 0.18);
    --text: #e8f1ff;
    --muted: #8aa0bc;
    --accent: #3d8bff;
    --cyan: #3ce0c8;
    --amber: #f5b942;
    --violet: #8b7cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(61,139,255,.22), transparent 55%),
      radial-gradient(900px 500px at 110% 10%, rgba(60,224,200,.12), transparent 50%),
      linear-gradient(180deg, var(--bg0), var(--bg1) 40%, #091420);
    overflow: hidden;
  }
  .grid-bg {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(80,140,220,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80,140,220,.07) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
  }
  .shell { position: relative; height: 100%; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px 8px; z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #2d7bff, #3ce0c8);
    display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #062033;
    box-shadow: 0 8px 24px rgba(61,139,255,.35);
  }
  .brand h1 { font-size: 22px; letter-spacing: 1px; }
  .brand p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .clock-box { text-align: right; }
  .clock { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
  .date { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 12px 32px 32px;
  }
  .cards {
    width: min(1180px, 100%);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  .card {
    position: relative; isolation: isolate;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 28px 24px 22px;
    min-height: 340px;
    cursor: pointer;
    overflow: hidden;
    backdrop-filter: blur(16px);
    transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    display: flex; flex-direction: column;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-6px);
    border-color: rgba(160,210,255,.45);
    box-shadow: 0 18px 40px rgba(0,0,0,.28);
    outline: none;
  }
  .card::before {
    content: ""; position: absolute; inset: auto -20% 40% -20%; height: 180px;
    background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
    opacity: .22; z-index: -1;
  }
  .card.c1 { --glow: #3d8bff; }
  .card.c2 { --glow: #3ce0c8; }
  .card.c3 { --glow: #8b7cff; }
  .idx {
    position: absolute; top: 16px; right: 18px;
    font-size: 12px; color: var(--muted); letter-spacing: 2px;
  }
  .icon {
    width: 72px; height: 72px; border-radius: 18px;
    display: grid; place-items: center; margin-bottom: 22px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
  }
  .icon svg { width: 38px; height: 38px; }
  .card h2 { font-size: 26px; margin-bottom: 8px; }
  .card .desc { color: var(--muted); font-size: 14px; line-height: 1.6; flex: 1; }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    font-size: 13px; font-weight: 600; color: #062033;
  }
  .btn-main { background: linear-gradient(135deg, #5aa2ff, #3ce0c8); flex: 1; }
  .btn-ghost {
    background: transparent; color: var(--text);
    border: 1px solid var(--line);
  }
  .hint { margin-top: 10px; font-size: 12px; color: var(--muted); word-break: break-all; }

  .app-view {
    position: fixed; inset: 0; background: #050b14; display: none; flex-direction: column; z-index: 20;
  }
  .app-view.show { display: flex; }
  .app-bar {
    height: 56px; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: #0c1828; border-bottom: 1px solid var(--line);
  }
  .app-bar .title { font-weight: 700; flex: 1; }
  .app-bar button {
    height: 34px; padding: 0 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  .app-bar .back { background: #1b3a66; border-color: #2d5c99; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }

  @media (max-width: 980px) {
    body { overflow: auto; }
    .cards { grid-template-columns: 1fr; }
    .card { min-height: 220px; }
    .main { align-items: flex-start; padding-top: 20px; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="shell" id="home">
  <header class="topbar">
    <div class="brand">
      <div class="logo">SY</div>
      <div>
        <h1>设备工作台</h1>
        <p>SYRC 设备组 · 系统入口</p>
      </div>
    </div>
    <div class="clock-box">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="dateLine"></div>
    </div>
  </header>
  <main class="main">
    <section class="cards">
      <article class="card c1" tabindex="0" data-key="light" onclick="openApp('light')" onkeydown="onCardKey(event,'light')">
        <span class="idx">01</span>
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5aa2ff" stroke-width="1.8">
            <path d="M9 18h6M10 21h4"/>
            <path d="M12 3a6 6 0 0 0-3.5 10.8c.6.5 1 1.3 1.1 2.2h4.8c.1-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/>
          </svg>
        </div>
        <h2>按灯系统</h2>
        <p class="desc">产线按灯与计数看板，用于现场呼叫、计数与生产状态查看。</p>
        <div class="actions">
          <button class="btn btn-main" type="button">进入系统</button>
          <button class="btn btn-ghost" type="button" onclick="event.stopPropagation(); openBlank('light')">新窗口</button>
        </div>
        <div class="hint">http://8.130.30.231:8080/count-board</div>
      </article>

      <article class="card c2" tabindex="0" data-key="attendance" onclick="openApp('attendance')" onkeydown="onCardKey(event,'attendance')">
        <span class="idx">02</span>
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3ce0c8" stroke-width="1.8">
            <rect x="3" y="4" width="18" height="17" rx="2"/>
            <path d="M8 2v4M16 2v4M3 10h18"/>
            <path d="M8 15h3M14 15h2"/>
          </svg>
        </div>
        <h2>考勤系统</h2>
        <p class="desc">设备组出勤、加班、调休与日报管理，支持管理员与技术员入口。</p>
        <div class="actions">
          <button class="btn btn-main" type="button">进入系统</button>
          <button class="btn btn-ghost" type="button" onclick="event.stopPropagation(); openBlank('attendance')">新窗口</button>
        </div>
        <div class="hint">本机入口 /attendance · 外网 http://8.130.30.231:3000/attendance</div>
      </article>

      <article class="card c3" tabindex="0" data-key="warehouse" onclick="openApp('warehouse')" onkeydown="onCardKey(event,'warehouse')">
        <span class="idx">03</span>
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#b3a8ff" stroke-width="1.8">
            <path d="M3 20V9l9-6 9 6v11"/>
            <path d="M9 20v-7h6v7"/>
          </svg>
        </div>
        <h2>仓库系统</h2>
        <p class="desc">飞书仓库应用，用于物料、库存与出入库相关业务操作。</p>
        <div class="actions">
          <button class="btn btn-main" type="button">进入系统</button>
          <button class="btn btn-ghost" type="button" onclick="event.stopPropagation(); openBlank('warehouse')">新窗口</button>
        </div>
        <div class="hint">飞书应用 · 若内嵌被拦截请用新窗口打开</div>
      </article>
    </section>
  </main>
</div>

<div class="app-view" id="appView">
  <div class="app-bar">
    <button class="back" type="button" onclick="closeApp()">← 返回工作台</button>
    <div class="title" id="appTitle">系统</div>
    <button type="button" onclick="reloadApp()">刷新</button>
    <button type="button" onclick="openCurrentBlank()">新窗口打开</button>
  </div>
  <iframe id="appFrame" title="系统画面"></iframe>
</div>

<script>
  var APPS = {
    light: {
      name: '按灯系统',
      url: 'http://8.130.30.231:8080/count-board'
    },
    attendance: {
      name: '考勤系统',
      url: '/attendance'
    },
    warehouse: {
      name: '仓库系统',
      url: 'https://cvte-seewo.feishuapp.com/app/app_4k5zrnu327jz5'
    }
  };
  var currentKey = null;

  function tick() {
    var now = new Date();
    var pad = function(n){ return String(n).padStart(2,'0'); };
    document.getElementById('clock').textContent =
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    var week = ['日','一','二','三','四','五','六'][now.getDay()];
    document.getElementById('dateLine').textContent =
      now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日  星期' + week;
  }
  tick();
  setInterval(tick, 1000);

  function onCardKey(e, key) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openApp(key); }
  }
  function openApp(key) {
    currentKey = key;
    var app = APPS[key];
    document.getElementById('appTitle').textContent = app.name;
    document.getElementById('appFrame').src = app.url;
    document.getElementById('appView').classList.add('show');
  }
  function closeApp() {
    document.getElementById('appView').classList.remove('show');
    document.getElementById('appFrame').src = 'about:blank';
    currentKey = null;
  }
  function reloadApp() {
    if (!currentKey) return;
    document.getElementById('appFrame').src = APPS[currentKey].url;
  }
  function openBlank(key) {
    window.open(APPS[key].url, '_blank', 'noopener');
  }
  function openCurrentBlank() {
    if (currentKey) openBlank(currentKey);
  }
</script>
</body>
</html>
